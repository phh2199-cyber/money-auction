<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>첫 월급 재테크 경매 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0f1430; --bg2:#1d1442; --ink:#f4f5ff; --muted:rgba(244,245,255,.68);
  --glass:rgba(255,255,255,.08); --glass2:rgba(255,255,255,.14); --line:rgba(255,255,255,.18);
  --pri:#8b7bff; --pri2:#5ee0ff; --good:#5eead4; --bad:#ff8a9a; --warn:#fcd34d;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Gowun Dodum',system-ui,sans-serif; color:var(--ink); line-height:1.55;
  background:radial-gradient(1200px 700px at 10% -10%,#3a2b8f 0%,transparent 60%),
             radial-gradient(900px 600px at 110% 20%,#0e6e8c 0%,transparent 55%),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed; overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:999; opacity:.16; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:-1;pointer-events:none}
.b1{width:380px;height:380px;background:#ff8fab;top:55%;left:-120px}
.b2{width:420px;height:420px;background:#6d5dfc;top:-120px;right:15%}
.b3{width:320px;height:320px;background:#2dd4bf;bottom:-120px;right:-80px}
.glass{
  background:var(--glass); border:1px solid var(--line); border-radius:var(--r);
  backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 12px 40px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.15);
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;padding:18px 18px 60px}
.pad{padding:22px}
h1{font-size:clamp(28px,4.6vw,46px);line-height:1.25;letter-spacing:-.5px}
h2{font-size:20px;margin-bottom:14px}
h3{font-size:17px}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);font-size:13px;margin-bottom:12px}

/* 상단 바 */
.top{position:sticky;top:10px;z-index:50;margin:10px auto 0;max-width:1280px;width:calc(100% - 24px);
  display:flex;align-items:center;gap:14px;padding:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-size:28px}
.brand b{display:block;font-size:17px}
.brand small{color:var(--muted);font-size:12px}
.steps{display:flex;gap:6px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap;border:1px solid transparent;color:var(--muted);transition:.2s}
.step.on{background:linear-gradient(135deg,rgba(139,123,255,.55),rgba(94,224,255,.4));color:#fff;border-color:var(--line)}
.step:hover{color:#fff}
.tools{display:flex;gap:6px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:16px;font-size:15px;transition:.18s;border:1px solid var(--line)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--pri),#5b8cff);border-color:rgba(255,255,255,.3);box-shadow:0 8px 24px rgba(109,93,252,.45)}
.btn.good{background:linear-gradient(135deg,#14b8a6,#22c55e);border-color:rgba(255,255,255,.3)}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#f97316);border-color:rgba(255,255,255,.3)}
.btn.ghost{background:var(--glass)}
.btn.danger{background:rgba(255,138,154,.2);border-color:rgba(255,138,154,.5)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:12px}
.btn.lg{padding:16px 28px;font-size:17px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* 설정 */
.hero{display:flex;align-items:center;gap:20px;padding:30px;margin-bottom:18px}
.hero-txt{flex:1}
.hero p{color:var(--muted);margin-top:12px;max-width:640px}
.hero-emoji{font-size:clamp(60px,10vw,110px);filter:drop-shadow(0 10px 30px rgba(0,0,0,.4))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.field:last-of-type{border-bottom:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:12px;background:var(--glass2);border:1px solid var(--line);font-size:18px}
.stepper b{min-width:56px;text-align:center}
select,.inp{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;outline:none}
select option{color:#111}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names label{display:flex;align-items:center;gap:8px}
.names .inp{width:100%}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.cta{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}

/* 경매사 */
.host{display:flex;align-items:center;gap:16px;padding:14px 18px;margin-bottom:16px}
.avatar{width:96px;height:96px;flex:none;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#ffffff 0%,#e9e7ff 70%);border:3px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.avatar svg{position:absolute;inset:4px 0 0 0;width:100%;height:100%}
.gv{transform-box:view-box;transform-origin:278px 345px}
.avatar.talk{animation:bob .5s ease}
.avatar.strike .gv,#hammer svg.hit .gv{animation:strike2 .45s ease 2}
.hero-char{width:clamp(130px,18vw,210px);flex:none;filter:drop-shadow(0 14px 30px rgba(0,0,0,.35));animation:float 3s ease-in-out infinite}
.hero-char svg{width:100%;height:auto;display:block}
#hammer .h svg{width:150px;height:auto;display:block}
@keyframes strike2{0%{transform:rotate(0)}40%{transform:rotate(22deg)}70%{transform:rotate(-8deg)}100%{transform:rotate(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hostname{font-size:12px;color:var(--muted);margin-bottom:4px}
.bubble{position:relative;flex:1;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.92);color:#1e1b3a;font-size:clamp(16px,2.2vw,21px);line-height:1.45;animation:pop .35s ease}
.bubble::before{content:"";position:absolute;left:-9px;top:24px;border:9px solid transparent;border-right-color:rgba(255,255,255,.92);border-left:0}
.bubble b{color:#5b3df5}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-5px) rotate(-3deg)}}
@keyframes strike{0%{transform:rotate(0)}40%{transform:rotate(-45deg)}70%{transform:rotate(15deg)}100%{transform:rotate(0)}}

/* 경매 */
.auction{display:grid;grid-template-columns:1fr 1.15fr;gap:18px}
.itemcard{padding:26px;position:relative;overflow:hidden}
.itemcard .big{font-size:clamp(60px,8vw,88px);line-height:1}
.itemcard h2{font-size:clamp(24px,3.2vw,32px);margin:12px 0 4px}
.itemcard .sub{color:var(--muted)}
.itemcard .desc{margin-top:16px;padding:14px 16px;border-radius:16px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.lot{position:absolute;top:18px;right:20px;font-size:13px;color:var(--muted)}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);margin-right:6px}
.tag.safe{background:rgba(94,234,212,.18)}
.tag.mid{background:rgba(125,211,252,.18)}
.tag.risk{background:rgba(252,211,77,.2)}
.tag.trap{background:rgba(255,138,154,.2)}
.secret{margin-top:16px;display:flex;align-items:center;gap:10px;font-size:15px;flex-wrap:wrap}
.secret b{font-size:20px;letter-spacing:1px}
.ctrl{padding:22px;display:flex;flex-direction:column;gap:14px}
.pricebox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:18px;
  background:linear-gradient(135deg,rgba(139,123,255,.3),rgba(94,224,255,.15));border:1px solid var(--line)}
.pricebox small{color:var(--muted);display:block;font-size:13px}
.pricebox .p{font-size:clamp(30px,4.4vw,44px);line-height:1.1}
.pricebox .who{text-align:right;font-size:17px}
.pricebox.flash{animation:flash .5s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(252,211,77,.8)}100%{box-shadow:0 0 0 18px rgba(252,211,77,0)}}
.cd{display:flex;gap:6px;justify-content:center}
.cd i{width:46px;height:8px;border-radius:99px;background:rgba(255,255,255,.15);transition:.3s}
.cd i.on{background:linear-gradient(90deg,#f59e0b,#ff8fab)}
.bidrows{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid var(--line);transition:.2s}
.brow.lead{border-color:#fcd34d;background:rgba(252,211,77,.14)}
.brow .tn{flex:1;min-width:0}
.brow .tn b{display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .tn small{color:var(--muted);font-size:12px}
.brow .bb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.brow .bb .btn{padding:8px 11px;font-size:14px;border-radius:12px}
.crown{font-size:13px;padding:6px 10px;border-radius:10px;background:rgba(252,211,77,.25)}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.log{font-size:13px;color:var(--muted);max-height:70px;overflow:auto;display:flex;flex-wrap:wrap;gap:4px 10px}
.reveal{padding:18px;border-radius:18px;background:linear-gradient(135deg,rgba(139,123,255,.25),rgba(94,224,255,.15));border:1px solid var(--line);animation:pop .4s ease}
.reveal .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.reveal .row:last-of-type{border-bottom:none}
.verdict{margin-top:10px;font-size:17px}
.hot{color:var(--bad)} .cool{color:var(--good)}
.lots{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.lotchip{padding:6px 10px;border-radius:12px;font-size:13px;background:var(--glass);border:1px solid var(--line)}
.lotchip.cur{border-color:#fff;background:var(--glass2)}
.lotchip.sold{opacity:.55}
.lotchip.passed{border-style:dashed}

/* 학습 노트 */
.learn{padding:18px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(94,234,212,.45);animation:pop .45s ease .1s both}
.learn .lh{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:10px}
.learn .lh span{padding:3px 10px;border-radius:999px;background:rgba(94,234,212,.22);font-size:12px}
.lsec{padding:10px 0;border-top:1px dashed var(--line)}
.lsec:first-of-type{border-top:none;padding-top:0}
.lsec b{display:block;margin-bottom:4px;font-size:15px}
.lsec p{font-size:15px;color:rgba(244,245,255,.9)}
.lsec ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.lsec li{font-size:15px;padding-left:22px;position:relative}
.lsec li::before{content:"✔";position:absolute;left:0;color:var(--good)}

/* 보드 */
.boardtitle{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tcard{padding:14px 16px}
.tcard .nm{display:flex;align-items:center;gap:8px;font-size:16px}
.tcard .money{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;margin-top:8px;font-size:13px;color:var(--muted)}
.tcard .money span{white-space:nowrap}
.tcard .money b{color:var(--ink);font-size:15px}
.tcard .its{margin-top:8px;font-size:20px;letter-spacing:2px;min-height:28px}
.tcard .its .dead{opacity:.25;filter:grayscale(1)}

/* 이벤트 */
.eventgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}
.stage{padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.progress{width:100%;display:flex;gap:6px}
.progress i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.12)}
.progress i.on{background:linear-gradient(90deg,var(--pri),var(--pri2))}
.flip{perspective:1200px;width:100%;max-width:360px;aspect-ratio:3/4}
.card3d{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.card3d.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.back{background:linear-gradient(145deg,rgba(139,123,255,.55),rgba(94,224,255,.3));box-shadow:0 20px 50px rgba(0,0,0,.35)}
.back .q{font-size:110px;line-height:1;opacity:.9}
.back small{letter-spacing:6px;margin-top:10px;opacity:.85}
.front{transform:rotateY(180deg);background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.front .em{font-size:76px}
.front h2{font-size:clamp(22px,3vw,28px);margin:8px 0}
.front p{color:var(--muted);font-size:15px}
.lesson{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.25);font-size:14px;text-align:left}
.results{padding:22px;display:flex;flex-direction:column;gap:10px}
.rrow{padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--line);animation:pop .4s ease both}
.rrow .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rrow ul{list-style:none;margin-top:6px;font-size:14px;color:var(--muted)}
.rrow li{padding:2px 0}
.delta{font-size:15px;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

/* 결과 */
.podium{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rank{padding:20px;position:relative}
.rank .medal{font-size:34px;position:absolute;top:14px;right:16px}
.rank .total{font-size:44px;line-height:1.1;margin:6px 0 10px}
.rank .total small{font-size:16px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width 1s}
.bar.g i{background:linear-gradient(90deg,#14b8a6,#86efac)}
.bar.y i{background:linear-gradient(90deg,#f59e0b,#fcd34d)}
.insight{list-style:none;margin-top:12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.debrief{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:18px}
.qlist{list-style:none;counter-reset:q;display:flex;flex-direction:column;gap:10px}
.qlist li{counter-increment:q;padding:12px 14px 12px 50px;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--line);position:relative}
.qlist li::before{content:counter(q);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:13px}
.qlist small{display:block;color:var(--muted);margin-top:4px}
.pyramid{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.pyramid div{padding:12px;border-radius:14px;text-align:center;border:1px solid var(--line)}
.pyramid .p3{width:55%;background:rgba(252,211,77,.2)}
.pyramid .p2{width:75%;background:rgba(125,211,252,.2)}
.pyramid .p1{width:95%;background:rgba(94,234,212,.22)}
.notes{margin-top:18px}
.todo{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.todo div{padding:16px 12px;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--line);text-align:center;font-size:14px}
.todo b{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 8px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));font-size:14px}
.promise{margin-top:14px;padding:14px 16px;border-radius:16px;background:rgba(252,211,77,.12);border:1px dashed rgba(252,211,77,.6);font-size:15px}
.promise b{color:var(--warn);margin-right:6px}
.promise u{text-decoration:none;border-bottom:2px solid rgba(255,255,255,.6);display:inline-block;min-width:60px}
.notegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
details.note{border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--line);padding:12px 14px}
details.note summary{cursor:pointer;font-size:16px;list-style:none;display:flex;align-items:center;gap:8px}
details.note summary::-webkit-details-marker{display:none}
details.note summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details.note[open] summary::after{content:"－"}
details.note .learn{margin-top:10px;animation:none}

/* 낙찰 연출 */
#hammer{position:fixed;inset:0;display:grid;place-items:center;z-index:400;pointer-events:none;opacity:0;transition:opacity .2s}
#hammer.show{opacity:1}
#hammer .stamp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 46px;border-radius:30px;background:rgba(20,16,50,.75);border:2px solid rgba(252,211,77,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#hammer .t{font-size:clamp(36px,6vw,60px);color:#fcd34d;letter-spacing:4px}
#hammer .s{font-size:20px}

/* 모달·토스트 */
.modal{position:fixed;inset:0;background:rgba(5,6,20,.55);display:grid;place-items:center;z-index:200;padding:18px;backdrop-filter:blur(6px)}
.modal[hidden]{display:none}
.modal-card{max-width:580px;width:100%;padding:26px;max-height:88vh;overflow:auto;animation:pop .3s ease}
.modal-card ol,.modal-card ul{padding-left:20px;display:flex;flex-direction:column;gap:6px;margin:10px 0}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;padding:12px 20px;border-radius:14px;background:rgba(20,20,40,.85);border:1px solid var(--line);transition:.3s;z-index:300;pointer-events:none;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .todo{grid-template-columns:repeat(3,1fr)}
  .auction,.eventgrid,.grid2,.debrief{grid-template-columns:1fr}
  .top{position:static}
  .steps{order:3;flex-basis:100%;justify-content:flex-start}
}
@media (max-width:520px){
  .wrap{padding:12px 12px 50px}
  .hero{flex-direction:column-reverse;text-align:center;padding:22px}
  .names{grid-template-columns:1fr}
  .pad,.ctrl,.itemcard,.results,.stage{padding:16px}
  .board{grid-template-columns:1fr 1fr}
  .tcard{padding:12px}
  .tools .btn span{display:none}
  .host{padding:12px;gap:10px}
  .avatar{width:66px;height:66px}
  .hero-char{width:130px}
  .brow{flex-wrap:wrap}
  .brow .bb{width:100%}
  .brow .bb .btn{flex:1}
  .actions{grid-template-columns:1fr 1fr}
  .actions .btn:first-child{grid-column:1/-1}
  .notegrid{grid-template-columns:1fr}
  .todo{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

const fresh=()=>({step:'setup',setup:{count:5,cash:1000,rounds:6,names:[...DEFAULT_NAMES]},teams:[],idx:0,sales:{},reveal:null,auc:null,host:'',deck:[],drawn:0,last:null,sound:true});
let S=load()||fresh();
const hist=[];
let justDrew=false, cdStep=0, cdTimer=null, flashPrice=false, audio=null;

function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function snap(){hist.push(JSON.stringify(S));if(hist.length>80)hist.shift()}

/* ===================== 유틸 ===================== */
const $=s=>document.querySelector(s);
const fmt=n=>`${Math.round(n).toLocaleString('ko-KR')}만원`;
const IT=id=>ITEMS.find(x=>x.id===id);
const EV=id=>EVENTS.find(x=>x.id===id);
const own=(t,id)=>t.items.find(x=>x.id===id);
const alive=(t,id)=>{const x=own(t,id);return !!(x&&x.value>0)};
const assets=t=>t.cash+t.items.reduce((s,x)=>s+x.value,0);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const startPrice=it=>it.value>=300?100:it.value>=150?50:20;

function mult(t,tag,k){
  const n=[];
  t.items.forEach(x=>{const it=IT(x.id);if(it.tags.includes(tag)&&x.value>0){const o=x.value;x.value=Math.round(o*k);n.push(`${it.emoji} ${it.name} ${fmt(o)} → ${fmt(x.value)}`)}});
  return n;
}
function pay(t,amt,reason,crisis){
  let rem=amt;const parts=[];let forced=false;
  if(crisis){const em=t.items.find(x=>x.id==='emer'&&x.value>0);if(em){const u=Math.min(em.value,rem);em.value-=u;rem-=u;parts.push(`비상금 ${fmt(u)}`)}}
  if(rem>0&&t.cash>0){const u=Math.min(t.cash,rem);t.cash-=u;rem-=u;parts.push(`현금 ${fmt(u)}`)}
  while(rem>0){
    const c=t.items.filter(x=>x.value>0).sort((a,b)=>b.value-a.value)[0];
    if(!c){t.cash-=rem;parts.push(`빚 ${fmt(rem)}`);rem=0;forced=true;break}
    const sale=Math.round(c.value*0.7);c.value=0;c.forced=true;forced=true;
    parts.push(`${IT(c.id).emoji}${IT(c.id).name} 헐값 매도(70%·${fmt(sale)})`);
    if(sale>=rem){t.cash+=sale-rem;rem=0}else rem-=sale;
  }
  if(crisis){forced?t.crisisFail++:t.crisisDefended++}else if(forced)t.crisisFail++;
  return `${forced?'⚠️':'💳'} ${reason} ${fmt(amt)} → ${parts.join(' + ')}`;
}
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200)}
function openModal(body,foot){$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot||'<button class="btn primary" data-action="closeModal">확인</button>';$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true}

/* 효과음 (클릭 이후에만 재생) */
function initAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}if(audio&&audio.state==='suspended')audio.resume()}catch(e){audio=null}}
function tone(freq,dur,type,vol,delay){
  if(!S.sound||!audio)return;
  try{const t0=audio.currentTime+(delay||0);const o=audio.createOscillator();const g=audio.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.5),t0+dur);
    g.gain.setValueAtTime(vol||0.25,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g);g.connect(audio.destination);o.start(t0);o.stop(t0+dur+0.02)}catch(e){}
}
const sfx={
  bid:()=>tone(880,.12,'triangle',.18),
  tick:()=>tone(520,.15,'square',.12),
  hammer:()=>{tone(140,.25,'square',.35);tone(90,.35,'sine',.4,.04);tone(1046,.5,'triangle',.15,.15)},
  flip:()=>{tone(400,.12,'triangle',.15);tone(700,.18,'triangle',.15,.08)}
};

/* ===================== 경매 진행 ===================== */
function openLot(){
  const it=ITEMS[S.idx];
  S.auc={price:startPrice(it),leader:null,bids:[]};
  S.host=pick([
    `자, <b>${S.idx+1}번째 품목</b>입니다! ${it.emoji} <b>${it.name}</b>! 시작가 <b>${fmt(startPrice(it))}</b>부터 갑니다. 손 드실 팀 계십니까?`,
    `다음 품목 나갑니다! ${it.emoji} <b>${it.name}</b>, "${it.sub}"! 시작가는 <b>${fmt(startPrice(it))}</b>입니다!`,
    `이번엔 ${it.emoji} <b>${it.name}</b>입니다. 실제 가치는 낙찰 후에 공개됩니다. 시작가 <b>${fmt(startPrice(it))}</b>!`
  ]);
}
function stopCountdown(){if(cdTimer){clearTimeout(cdTimer);cdTimer=null}cdStep=0}
function raise(ti,inc){
  initAudio();
  const a=S.auc;const t=S.teams[ti];
  const np=a.leader===null?a.price:a.price+inc;
  if(t.cash<np) return toast(`${t.name}의 현금(${fmt(t.cash)})으로는 ${fmt(np)}에 응찰할 수 없어요`);
  if(a.leader===ti) return toast('이미 최고가 응찰 팀이에요');
  snap();stopCountdown();
  a.price=np;a.leader=ti;a.bids.push({team:ti,price:np});
  const n=a.bids.length;
  S.host=n===1?pick([`<b>${esc(t.name)}</b>, 시작가 <b>${fmt(np)}</b> 응찰! 첫 손님 감사합니다. 더 없습니까?`,`좋습니다! <b>${esc(t.name)}</b>에서 <b>${fmt(np)}</b>! 다른 팀은요?`])
    :pick([`<b>${esc(t.name)}</b> <b>${fmt(np)}</b>! 더 없습니까?`,`오~ <b>${esc(t.name)}</b>에서 <b>${fmt(np)}</b> 나왔습니다!`,`<b>${fmt(np)}</b>! <b>${esc(t.name)}</b>가 치고 나갑니다! 더 부르실 분?`,`경쟁이 뜨겁네요! <b>${esc(t.name)}</b> <b>${fmt(np)}</b>!`,`<b>${fmt(np)}</b>까지 올라왔습니다! 정말 그만한 가치가 있을까요? 🤔`]);
  flashPrice=true;sfx.bid();save();render();
}
function undoBid(){
  const a=S.auc;if(!a||!a.bids.length) return toast('취소할 응찰이 없어요');
  snap();stopCountdown();a.bids.pop();
  const last=a.bids[a.bids.length-1];
  if(last){a.price=last.price;a.leader=last.team}else{a.price=startPrice(ITEMS[S.idx]);a.leader=null}
  S.host=last?`응찰 하나 취소합니다. 현재 최고가는 <b>${esc(S.teams[last.team].name)}</b> <b>${fmt(last.price)}</b>!`:'응찰이 모두 취소되었습니다. 다시 시작가부터 갑니다!';
  save();render();
}
function countdown(){
  initAudio();
  const a=S.auc;if(!a||a.leader===null) return toast('응찰한 팀이 없어요. 유찰하거나 응찰을 받아 주세요');
  if(cdTimer) return;
  const lines=[`<b>${fmt(a.price)}</b>! 하나… 갑니다!`,`<b>${fmt(a.price)}</b>! 둘…!`,`마지막 기회! <b>${fmt(a.price)}</b>! 더 없습니까?!`];
  const tick=()=>{
    if(cdStep<3){S.host=lines[cdStep];cdStep++;sfx.tick();render();cdTimer=setTimeout(tick,1300)}
    else{cdTimer=null;cdStep=0;hammer()}
  };
  cdStep=0;tick();
}
function hammer(){
  initAudio();stopCountdown();
  const a=S.auc;if(!a||a.leader===null) return toast('응찰한 팀이 없어요');
  const it=ITEMS[S.idx];const t=S.teams[a.leader];const price=a.price;
  if(t.cash<price) return toast(`${t.name}의 현금이 부족해요`);
  snap();
  t.cash-=price;t.items.push({id:it.id,paid:price,value:it.value});
  S.sales[it.id]={team:a.leader,price,bids:a.bids.length};S.reveal=it.id;
  const diff=price-it.value;
  S.host=`🔨 <b>${esc(t.name)}</b>, <b>${fmt(price)}</b>에 낙찰! 자, 실제 가치는… <b>${fmt(it.value)}</b>입니다! `+
    (it.id==='scam'?'과연 이 가치가 끝까지 유지될까요? 😏':it.monthly?`앞으로 이벤트 카드마다 ${it.monthly.label} <b>${fmt(it.monthly.amt)}</b>씩 빠져나간다는 것, 잊지 마세요!`:
     diff>0?pick([`${fmt(diff)} 비싸게 사셨네요. 경쟁 분위기에 휩쓸리셨나요? 😅`,`${fmt(diff)} 웃돈을 주셨습니다. "이기고 싶은 마음"도 소비 심리입니다!`])
     :diff<0?pick([`${fmt(-diff)}나 싸게 사셨어요! 현명한 입찰입니다 👏`,`가치보다 ${fmt(-diff)} 저렴하게! 훌륭합니다!`]):'딱 정가에 사셨네요. 정확한 눈썰미입니다!');
  save();render();showHammer(`${t.name} · ${fmt(price)}`);
}
function showHammer(sub){
  sfx.hammer();
  $('#hammerSub').textContent=sub;const h=$('#hammer');h.classList.remove('show');void h.offsetWidth;h.classList.add('show');
  const av=document.querySelector('.avatar');const hc=document.querySelector('#hammerChar svg');if(hc){hc.classList.remove('hit');void hc.getBoundingClientRect();hc.classList.add('hit')}if(av){av.classList.remove('strike');void av.offsetWidth;av.classList.add('strike')}
  clearTimeout(showHammer._t);showHammer._t=setTimeout(()=>h.classList.remove('show'),1400);
}
function passItem(){
  const it=ITEMS[S.idx];if(S.sales[it.id]&&!S.sales[it.id].passed) return;
  snap();stopCountdown();S.sales[it.id]={passed:true};
  nextItem(`아무도 없나요? ${it.emoji} <b>${it.name}</b>은(는) <b>유찰</b>입니다! 때로는 "안 사는 것"도 좋은 선택이죠.`);
}
function nextItem(prefix){
  stopCountdown();S.reveal=null;
  for(let k=1;k<=ITEMS.length;k++){const j=(S.idx+k)%ITEMS.length;if(!S.sales[ITEMS[j].id]){S.idx=j;openLot();if(prefix)S.host=prefix+' '+S.host;save();render();return}}
  S.idx=ITEMS.length;S.auc=null;
  S.host=(prefix?prefix+' ':'')+'모든 품목의 경매가 끝났습니다! 🎉 이제 <b>인생 이벤트 카드</b>로 여러분의 선택이 어떤 결과를 낳는지 확인해 봅시다!';
  save();render();
}

/* ===================== 이벤트·점수 ===================== */
function buildDeck(){
  const n=S.setup.rounds;
  const others=shuffle(EVENTS.map(e=>e.id).filter(id=>!['hospital','scam_pay','scam_bust'].includes(id)));
  S.deck=[...shuffle(['hospital','scam_pay',...others.slice(0,Math.max(0,n-3))]),'scam_bust'];
  S.drawn=0;S.last=null;
}
function startGame(){
  snap();stopCountdown();
  const st=S.setup;const snd=S.sound;
  S={...fresh(),setup:st,sound:snd,step:'auction'};
  S.teams=Array.from({length:st.count},(_,i)=>({name:(st.names[i]||DEFAULT_NAMES[i]||`${i+1}팀`).trim()||`${i+1}팀`,color:COLORS[i],cash:st.cash,items:[],crisisFail:0,crisisDefended:0,fees:0}));
  buildDeck();S.idx=0;openLot();
  const f=ITEMS[0];
  S.host=`안녕하세요, 오늘 경매를 진행할 <b>${HOST}</b>입니다! 🎩 각 팀에 <b>${fmt(st.cash)}</b>씩 드렸습니다. 첫 월급, 어디에 쓰시겠습니까? 첫 번째 품목은 ${f.emoji} <b>${f.name}</b>! 시작가 <b>${fmt(startPrice(f))}</b>부터 갑니다!`;
  save();render();window.scrollTo({top:0,behavior:'smooth'});
}
function draw(){
  if(S.drawn>=S.deck.length) return;
  initAudio();snap();
  const ev=EV(S.deck[S.drawn]);
  const res=S.teams.map((t,i)=>{
    const before=assets(t);const notes=ev.run(t)||[];
    t.items.forEach(x=>{const m=IT(x.id).monthly;if(m&&x.value>0){notes.push(pay(t,m.amt,m.label,false));t.fees=(t.fees||0)+m.amt}});
    return {team:i,notes,delta:assets(t)-before};
  });
  S.last={id:ev.id,res};S.drawn++;justDrew=true;
  const best=[...res].sort((a,b)=>b.delta-a.delta)[0],worst=[...res].sort((a,b)=>a.delta-b.delta)[0];
  S.host=`${ev.emoji} <b>${ev.title}</b>${ev.title.endsWith('!')?'':'!'} `+(worst.delta<0?`가장 타격이 큰 팀은 <b>${esc(S.teams[worst.team].name)}</b>(${fmt(worst.delta)})이네요. `:'')+(best.delta>0?`<b>${esc(S.teams[best.team].name)}</b>은(는) 웃었습니다! `:'')+'아래 학습 노트에서 이유를 함께 볼까요?';
  sfx.flip();save();render();
}
function scores(){
  const max=Math.max(1,...S.teams.map(assets));
  return S.teams.map((t,i)=>{
    const a=assets(t);
    const assetScore=Math.max(0,Math.round(50*a/max));
    const tags=new Set();t.items.forEach(x=>IT(x.id).tags.forEach(g=>tags.add(g)));
    let stab=0;[['saving'],['protect'],['retire'],['growth','habit']].forEach(g=>{if(g.some(x=>tags.has(x)))stab+=6});
    const safeVal=Math.max(0,t.cash)+t.items.filter(x=>IT(x.id).risk==='safe').reduce((s,x)=>s+x.value,0);
    if(a>0&&safeVal/a>=0.3) stab+=6;
    const riskyPaid=t.items.filter(x=>['risk','trap'].includes(IT(x.id).risk)).reduce((s,x)=>s+x.paid,0);
    if(riskyPaid/S.setup.cash>0.4) stab-=6;
    stab=Math.max(0,Math.min(30,stab));
    const crisis=Math.max(0,Math.min(20,14+3*t.crisisDefended-7*t.crisisFail));
    const ins=[];
    const over=t.items.reduce((s,x)=>s+Math.max(0,x.paid-IT(x.id).value),0);
    if(over>0) ins.push(`🔥 감정가보다 ${fmt(over)} 더 지불 (경매 과열)`);
    if(own(t,'scam')) ins.push('🎁 "원금 보장" 리딩방에 걸려 손실');
    if((t.fees||0)>0) ins.push(`💸 할부·구독·보험료로 ${fmt(t.fees)} 지출`);
    if(t.crisisFail>0) ins.push(`⚠️ 위기 때 자산 헐값 매도 ${t.crisisFail}회`);
    if(t.crisisDefended>=2&&t.crisisFail===0) ins.push('🛡️ 모든 위기를 안전하게 방어');
    if(a>0&&t.cash/a>0.6) ins.push('💤 현금 비중 과다 — 물가 상승에 취약');
    if(riskyPaid/S.setup.cash>0.4) ins.push('🎢 소비·함정 품목 비중 40% 초과');
    if(!t.items.length) ins.push('🤷 아무것도 사지 않음');
    if(!ins.length) ins.push('👍 균형 잡힌 포트폴리오');
    return {i,t,a,assetScore,stab,crisis,total:assetScore+stab+crisis,ins};
  }).sort((x,y)=>y.total-x.total||y.a-x.a);
}

      <div class="nm"><span class="dot" style="background:${t.color};color:${t.color}"></span><b>${esc(t.name)}</b></div>
      <div class="money"><span>현금 <b>${fmt(t.cash)}</b></span><span>총 <b>${fmt(assets(t))}</b></span></div>
      <div class="its">${t.items.map(x=>`<span class="${x.value>0?'':'dead'}" title="${IT(x.id).name}">${IT(x.id).emoji}</span>`).join('')||'<span class="muted" style="font-size:13px;letter-spacing:0">보유 자산 없음</span>'}</div>
    </div>`).join('')}</div>`;
}

function lotChips(){
  return `<div class="lots">${ITEMS.map((it,i)=>{const s=S.sales[it.id];const cls=i===S.idx?'cur':s?(s.passed?'passed':'sold'):'';
    return `<button class="lotchip ${cls}" data-action="jump" data-v="${i}" title="${it.name}">${it.emoji} ${s&&!s.passed?'✔':s&&s.passed?'유찰':''}</button>`}).join('')}</div>`;
}

function vAuction(){
  if(!S.teams.length) return vSetup();
  const done=ITEMS.filter(it=>S.sales[it.id]&&!S.sales[it.id].passed).length;
  if(S.idx>=ITEMS.length){
    return `${hostBar(S.host)}<section class="glass pad" style="text-align:center">
      <div style="font-size:64px">🔨</div><h1>경매 종료!</h1>
      <p class="muted" style="margin:10px 0 18px">${done}개 품목이 낙찰되었습니다. 이제 인생 이벤트 카드로 선택의 결과를 확인해 볼까요?</p>
      <div class="cta"><button class="btn ghost" data-action="jump" data-v="0">품목 다시 보기</button><button class="btn primary lg" data-action="go" data-v="event">🃏 이벤트 단계로</button></div>
      ${lotChips()}</section>${board()}`;
  }
  const it=ITEMS[S.idx];const sale=S.sales[it.id];const sold=sale&&!sale.passed;
  if(!sold&&!S.auc) openLot();
  let right;
  if(sold){
    const t=S.teams[sale.team];const diff=sale.price-it.value;
    right=`<div class="reveal">
      <h3>🔨 낙찰 결과</h3>
      <div class="row"><span>낙찰 팀</span><b><span class="dot" style="background:${t.color};color:${t.color}"></span> ${esc(t.name)}</b></div>
      <div class="row"><span>낙찰가</span><b>${fmt(sale.price)}</b></div>
      <div class="row"><span>실제 가치(감정가)</span><b>${fmt(it.value)}</b></div>
      <div class="verdict ${diff>0?'hot':'cool'}">${diff>0?`🔥 ${fmt(diff)} 비싸게 샀어요!`:diff<0?`👍 ${fmt(-diff)} 싸게 샀어요!`:'⚖️ 딱 정가에 샀어요.'}</div>
    </div>
    ${learnBox(it.name,it.part,it.why,it.tips)}
    <div class="actions" style="grid-template-columns:2fr 1fr"><button class="btn primary lg" data-action="next">다음 품목 ▶</button><button class="btn ghost" data-action="undo">↩ 낙찰 취소</button></div>`;
  }else{
    const a=S.auc;const lead=a.leader!==null?S.teams[a.leader]:null;
    right=`<div class="pricebox">
        <div><small>${lead?'현재 최고가':'시작가'}</small><div class="p">${fmt(a.price)}</div></div>
        <div class="who">${lead?`<small>최고 응찰</small><b><span class="dot" style="background:${lead.color};color:${lead.color}"></span> ${esc(lead.name)}</b>`:'<small>응찰 대기 중</small>✋'}</div>
      </div>
      <div class="cd">${[0,1,2].map(i=>`<i class="${i<cdStep?'on':''}"></i>`).join('')}</div>
      <div class="bidrows">${S.teams.map((t,i)=>{
        const isLead=a.leader===i;
        const btns=a.leader===null
          ?`<button class="btn good" data-action="raise" data-t="${i}" data-v="0" ${t.cash<a.price?'disabled':''}>✋ ${fmt(a.price)} 응찰</button>`
          :isLead?`<span class="crown">👑 최고가</span>`
          :[10,50,100].map(inc=>`<button class="btn ghost" data-action="raise" data-t="${i}" data-v="${inc}" ${t.cash<a.price+inc?'disabled':''}>+${inc}</button>`).join('');
        return `<div class="brow ${isLead?'lead':''}"><div class="tn"><b><span class="dot" style="background:${t.color};color:${t.color}"></span>${esc(t.name)}</b><small>현금 ${fmt(t.cash)}</small></div><div class="bb">${btns}</div></div>`}).join('')}</div>
      ${a.bids.length?`<div class="log">📝 ${a.bids.map(b=>`${esc(S.teams[b.team].name)} ${b.price}`).join(' → ')}</div>`:''}
      <div class="actions">
        <button class="btn warn lg" data-action="countdown" ${a.leader===null||cdTimer?'disabled':''}>⏱ 하나·둘·셋 카운트다운</button>
        <button class="btn good" data-action="hammer" ${a.leader===null?'disabled':''}>🔨 즉시 낙찰</button>
        ${a.bids.length?'<button class="btn ghost" data-action="undoBid">↩ 응찰 취소</button>':'<button class="btn danger" data-action="pass">유찰</button>'}
      </div>`;
  }
  return `${hostBar(S.host)}
  <section class="auction">
    <div class="itemcard glass">
      <span class="lot">품목 ${S.idx+1} / ${ITEMS.length} · 낙찰 ${done}</span>
      <div class="big">${it.emoji}</div>
      <h2>${it.name}</h2>
      <div class="sub">${it.sub}</div>
      <div style="margin-top:12px"><span class="tag ${it.risk}">${RISK[it.risk]}</span></div>
      <div class="desc">${it.desc}</div>
      <div class="secret">💎 실제 가치: ${sold?`<b>${fmt(it.value)}</b>`:'<b>??? 만원</b><span class="muted" style="font-size:13px">(낙찰 후 공개)</span>'}</div>
      ${lotChips()}
    </div>
    <div class="ctrl glass">${right}</div>
  </section>${board()}`;
}

function vEvent(){
  if(!S.teams.length) return vSetup();
  if(!S.deck.length) buildDeck();
  const total=S.deck.length;const ev=S.last?EV(S.last.id):null;const finished=S.drawn>=total;
  const prog=`<div class="progress">${S.deck.map((_,i)=>`<i class="${i<S.drawn?'on':''}"></i>`).join('')}</div>`;
  const card=`<div class="flip"><div class="card3d ${ev?'flipped':''}">
      <div class="face back"><div class="q">🃏</div><small>LIFE EVENT</small><p style="margin-top:10px;opacity:.85">${S.drawn<total?`${S.drawn+1}번째 카드`:''}</p></div>
      <div class="face front">${ev?`<div class="em">${ev.emoji}</div><h2>${ev.title}</h2><p>${ev.desc}</p><div class="lesson">💡 ${ev.lesson}</div>`:''}</div>
    </div></div>`;
  const btn=finished?`<button class="btn primary lg" data-action="go" data-v="result">🏆 최종 결과 보기</button>`
    :`<button class="btn primary lg" data-action="draw">🃏 ${S.drawn===0?'첫 카드 뽑기':'다음 카드 뽑기'}</button>`;
  let results=`<div class="empty"><div style="font-size:46px">🎲</div><p>카드를 뽑으면 팀별 자산 변화와 학습 노트가 여기에 표시됩니다.</p><p style="font-size:13px;margin-top:6px">할부·구독·보험료가 있는 팀은 카드마다 해당 금액이 자동으로 빠져나가요.</p></div>`;
  if(S.last){
    results=learnBox(ev.title,ev.part,ev.why,ev.tips)+S.last.res.map((r,k)=>{const t=S.teams[r.team];return `<div class="rrow" style="animation-delay:${k*.07}s">
      <div class="hd"><b><span class="dot" style="background:${t.color};color:${t.color}"></span> ${esc(t.name)}</b>
      <span class="delta ${r.delta>0?'cool':r.delta<0?'hot':'muted'}">${r.delta>0?'▲ +':r.delta<0?'▼ ':''}${r.delta===0?'변동 없음':fmt(r.delta)}</span></div>
      ${r.notes.length?`<ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}</div>`}).join('');
  }
  const msg=S.last?S.host:`경매는 끝났지만 인생은 이제부터입니다! 😎 앞으로 <b>${total}장</b>의 인생 이벤트 카드가 기다리고 있어요. 첫 카드를 뽑아 볼까요?`;
  return `${hostBar(msg)}<section class="eventgrid">
    <div class="stage glass">${prog}<p class="muted">이벤트 카드 ${Math.min(S.drawn,total)} / ${total}</p>${card}${btn}</div>
    <div class="results glass"><h2>📋 ${ev?`'${ev.title}' 결과`:'라운드 결과'}</h2>${results}</div>
  </section>${board()}`;
}

    <div class="glass pad"><h2>🧭 오늘의 핵심 메시지</h2>

    <div class="promise">✍️ <b>나의 약속</b> 나는 매달 <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>만 원을 먼저 저축하고, <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> 계좌를 시작한다</div>

    <div class="notegrid">${ITEMS.map(it=>`<details class="note"><summary>${it.emoji} ${it.name} <span class="tag ${it.risk}" style="margin-left:6px">${RISK[it.risk]}</span></summary>${learnBox(it.name,`${it.part} · 감정가 ${fmt(it.value)}`,it.why,it.tips)}</details>`).join('')}</div>

/* ===================== 이벤트 바인딩 ===================== */
const H={
  go:v=>{ if(v!=='setup'&&!S.teams.length) return toast('먼저 게임을 시작해 주세요');
          stopCountdown(); if(v==='event'&&!S.deck.length) buildDeck(); S.step=v; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); },
  count:v=>{S.setup.count=Math.max(2,Math.min(10,S.setup.count+ +v));save();render()},
  rounds:v=>{S.setup.rounds=Math.max(3,Math.min(10,S.setup.rounds+ +v));save();render()},
  start:()=>{ initAudio(); if(S.teams.length){openModal('<h2>새 게임을 시작할까요?</h2><p class="muted">진행 중인 경매와 이벤트 기록이 모두 초기화됩니다.</p>','<button class="btn ghost" data-action="closeModal">취소</button><button class="btn primary" data-action="startYes">새로 시작</button>')} else startGame(); },
  startYes:()=>{closeModal();startGame()},
  reset:()=>openModal('<h2>새 게임을 준비할까요?</h2><p class="muted">팀 설정 화면으로 돌아가며 현재 기록이 지워집니다.</p>','<button class="btn ghost" data-action="closeModal">취소</button><button class="btn danger" data-action="resetYes">초기화</button>'),
  resetYes:()=>{closeModal();snap();stopCountdown();const st=S.setup,snd=S.sound;S={...fresh(),setup:st,sound:snd};save();render()},
  raise:(v,b)=>raise(+b.dataset.t,+v),
  undoBid, countdown, hammer, pass:passItem, next:()=>nextItem(),
  jump:v=>{stopCountdown();S.idx=+v;const it=ITEMS[S.idx];const s=S.sales[it.id];
    if(s&&s.passed){delete S.sales[it.id]}
    if(s&&!s.passed){S.reveal=it.id;S.host=`${it.emoji} <b>${it.name}</b>은(는) 이미 <b>${esc(S.teams[s.team].name)}</b>에 <b>${fmt(s.price)}</b>로 낙찰된 품목입니다. 학습 노트를 다시 볼까요?`}
    else{S.reveal=null;openLot()}
    save();render()},
  draw,
  undo:()=>{ if(!hist.length) return toast('되돌릴 작업이 없어요'); stopCountdown(); S=JSON.parse(hist.pop()); save(); render(); toast('한 단계 되돌렸어요'); },
  sound:()=>{S.sound=!S.sound;initAudio();save();render();toast(S.sound?'효과음 켜짐':'효과음 꺼짐')},
  rules:()=>openModal(`<h2>📖 게임 규칙</h2>
    <ol>
      <li>팀마다 같은 금액의 가상자금으로 시작합니다.</li>
      <li>경매사 <b>돈쌤</b>이 품목을 소개하고 시작가를 부릅니다. 첫 팀은 <b>"✋ 응찰"</b>, 이후 팀은 <b>+10 / +50 / +100</b>으로 가격을 올립니다.</li>
      <li>더 이상 응찰이 없으면 <b>"⏱ 카운트다운"</b>을 누르세요. "하나·둘·셋" 동안 새 응찰이 없으면 자동으로 <b>낙찰</b>됩니다. 카운트다운 중 응찰이 들어오면 다시 시작합니다.</li>
      <li>낙찰되면 <b>실제 가치(감정가)</b>와 함께 "왜 그런지", 관리 TIP이 담긴 학습 노트가 공개됩니다.</li>
      <li>할부·구독·보험료 품목은 이벤트 카드마다 정해진 금액이 자동으로 빠져나갑니다.</li>
      <li>경매가 끝나면 인생 이벤트 카드를 한 장씩 뽑습니다. 위기 지출은 <b>비상금 → 현금</b> 순서로 나가고, 둘 다 부족하면 가장 비싼 자산을 <b>70% 가격에 헐값 매도</b>합니다.</li>
      <li>최종 점수 = 자산 규모 50점 + 안정성·분산 30점 + 위기 대응 20점</li>
    </ol>
    <p class="muted" style="font-size:13px">진행 팁: 실수로 눌렀다면 '응찰 취소'나 상단의 '되돌리기'를 누르세요. 진행 상황은 이 브라우저에 자동 저장됩니다.</p>`),
  full:()=>{try{const d=document;if(d.fullscreenElement){d.exitFullscreen()}else{const p=d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>toast('이 화면에서는 전체화면을 지원하지 않아요'))}}catch(e){toast('이 화면에서는 전체화면을 지원하지 않아요')}},
  closeModal
};
